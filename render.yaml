# Render.com 一键免费部署配置
# 用法：把 card_site/ 推到 GitHub -> Render 新建 Blueprint -> 选此文件
# 免费版 Web Service 有休眠（不活跃 15 分钟休眠），但够用；SQLite 在重启后重置，
# 不影响已发卡密校验（卡密靠 HMAC 离线校验，与库存无关）。
services:
  - type: web
    name: 17kernel-card
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: CARD_SECRET
        value: "84ca1fb19e20a7da73035a8bdd3ca406a422b7414145487cc7be9c658bc9ec78dce4b24cb8c0bbfd"
        # ↑ 必须与 17内核 二进制里的 kLicenseSecret 完全一致（已与分发包内一致）。
        #   app.py 未设置环境变量时也会回退到该值，所以留空也能用，但显式写出来最稳。
      - key: SESSION_SECRET
        generateValue: true
        # ↑ 固定会话密钥：Render 生成并保管（不进仓库）。免费版休眠/重启后后台不会被登出。
      - key: ADMIN_PASSWORD
        sync: false
        # ↑ 不写死在仓库里。部署后在 Render 后台 Environment 自行设置一个强密码（否则用 app 本地随机默认，不安全）。
